name: Sideline
options:
  bundleIdPrefix: org.sideline
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Sideline
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sideline:
    type: application
    platform: iOS
    sources: [Sideline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oculodx.sideline
        DEVELOPMENT_TEAM: TR7PS55RCB
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sideline/Sideline.entitlements
        INFOPLIST_KEY_NSCameraUsageDescription: "Sideline uses the front camera to measure eye movement and pupil response during each check."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Sideline reads your sleep, heart rate and workouts as recovery context, and to check activity stays within your return-to-sport step."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Sideline saves each check and your baseline to Health as a clinical document with your biomarker results."
